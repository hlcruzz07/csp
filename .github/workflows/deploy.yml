name: Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🐘 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 📝 Create .env file
        run: |
          cat <<EOF > .env
          APP_NAME=${{ secrets.APP_NAME }}
          APP_ENV=local
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=${{ secrets.APP_DEBUG }}
          APP_URL=${{ secrets.APP_URL }}
          APP_API_BASE_URL=${{ secrets.APP_API_BASE_URL }}

          APP_LOCALE=${{ secrets.APP_LOCALE }}
          APP_FALLBACK_LOCALE=${{ secrets.APP_FALLBACK_LOCALE }}
          APP_FAKER_LOCALE=${{ secrets.APP_FAKER_LOCALE }}

          APP_MAINTENANCE_DRIVER=${{ secrets.APP_MAINTENANCE_DRIVER }}

          BCRYPT_ROUNDS=${{ secrets.BCRYPT_ROUNDS }}

          LOG_CHANNEL=${{ secrets.LOG_CHANNEL }}
          LOG_STACK=${{ secrets.LOG_STACK }}
          LOG_DEPRECATIONS_CHANNEL=${{ secrets.LOG_DEPRECATIONS_CHANNEL }}
          LOG_LEVEL=${{ secrets.LOG_LEVEL }}

          DB_CONNECTION=${{ secrets.DB_CONNECTION }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          SESSION_DRIVER=${{ secrets.SESSION_DRIVER }}
          SESSION_LIFETIME=${{ secrets.SESSION_LIFETIME }}
          SESSION_ENCRYPT=${{ secrets.SESSION_ENCRYPT }}
          SESSION_PATH=${{ secrets.SESSION_PATH }}
          SESSION_DOMAIN=${{ secrets.SESSION_DOMAIN }}

          BROADCAST_CONNECTION=${{ secrets.BROADCAST_CONNECTION }}
          FILESYSTEM_DISK=${{ secrets.FILESYSTEM_DISK }}
          QUEUE_CONNECTION=${{ secrets.QUEUE_CONNECTION }}

          CACHE_STORE=${{ secrets.CACHE_STORE }}

          MEMCACHED_HOST=${{ secrets.MEMCACHED_HOST }}

          REDIS_CLIENT=${{ secrets.REDIS_CLIENT }}
          REDIS_HOST=${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          REDIS_PORT=${{ secrets.REDIS_PORT }}

          MAIL_MAILER=${{ secrets.MAIL_MAILER }}
          MAIL_SCHEME=${{ secrets.MAIL_SCHEME }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME=${{ secrets.MAIL_FROM_NAME }}

          VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}

          REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}
          REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}

          REVERB_SERVER_HOST=${{ secrets.REVERB_SERVER_HOST }}
          REVERB_SERVER_PORT=${{ secrets.REVERB_SERVER_PORT }} 

          REVERB_HOST=${{ secrets.REVERB_HOST }}
          REVERB_PORT=${{ secrets.REVERB_PORT }}
          REVERB_SCHEME=${{ secrets.REVERB_SCHEME }}

          VITE_REVERB_APP_KEY=${{ secrets.VITE_REVERB_APP_KEY }}  
          VITE_REVERB_HOST=${{ secrets.VITE_REVERB_HOST }}
          VITE_REVERB_PORT=${{ secrets.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME=${{ secrets.VITE_REVERB_SCHEME }}

          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}

          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

          MESSAGE_NOTIFICATION_COOLDOWN_HOURS=${{ secrets.MESSAGE_NOTIFICATION_COOLDOWN_HOURS }}
          EOF

      - name: 📦 Install & build frontend assets
        run: |
          npm install
          npm run build

      - name: 🚀 Deploy to CloudPanel via SFTP / rsync
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          SSH_PORT: ${{ secrets.FTP_PORT || '22' }}
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          echo "Installing sshpass and rsync..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

          echo "Checking SSH connectivity to ${SSH_HOST}:${SSH_PORT}..."
          for attempt in 1 2 3; do
            if timeout 15 bash -c "</dev/tcp/${SSH_HOST}/${SSH_PORT}" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to reach ${SSH_HOST}:${SSH_PORT} from the GitHub runner. Check FTP_SERVER, FTP_PORT, and the server firewall/SSH service."
              exit 1
            fi
            echo "SSH connectivity check failed (attempt ${attempt}/3); retrying..."
            sleep 5
          done

          SSH_OPTIONS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ConnectionAttempts=3 -p ${SSH_PORT}"

          echo "Starting file synchronization to CloudPanel server..."
          sshpass -e rsync -rltz --delete \
            -e "ssh ${SSH_OPTIONS}" \
            --exclude=".git*" \
            --exclude=".github*" \
            --exclude="node_modules*" \
            --exclude="storage*" \
            --exclude="tests*" \
            --exclude="README.md" \
            --exclude="scratch*" \
            ./ ${SSH_USER}@${SSH_HOST}:htdocs/csp.scythelabs.online/

          echo "Running post-deployment Laravel commands on CloudPanel VPS..."
          sshpass -e ssh ${SSH_OPTIONS} ${SSH_USER}@${SSH_HOST} << 'EOF'
            cd htdocs/csp.scythelabs.online/
            chmod -R 775 storage bootstrap/cache
            php artisan storage:link || true
            php artisan migrate:fresh --force
            php artisan db:seed
            php artisan optimize:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan queue:restart || true

            # Restart Reverb WebSocket server in background
            pkill -f "artisan reverb:start" || true
            nohup php artisan reverb:start --port=8081 --host=127.0.0.1 > storage/logs/reverb.log 2>&1 &


            # Restart Queue Worker in background
            pkill -f "artisan queue:work" || true
            nohup php artisan queue:work --sleep=3 --tries=3 > storage/logs/queue.log 2>&1 &
          EOF

          echo "✅ Deployment completed successfully!"
