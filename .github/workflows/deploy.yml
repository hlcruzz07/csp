name: Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🐘 Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: 📝 Create .env file
        run: |
          cat <<'EOF' > .env
          APP_NAME="Counseling Support Platform"
          APP_ENV=production
          APP_KEY=base64:Jjj1Cg3uSCfnG5xzaN22i2ylV3cJ0tm5cwsWlGVY8aE=
          APP_DEBUG=false
          APP_URL=https://csp.scythelabs.online
          APP_API_BASE_URL=https://csp.scythelabs.online/api

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US

          APP_MAINTENANCE_DRIVER=file

          BCRYPT_ROUNDS=12

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_DEPRECATIONS_CHANNEL=null
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=scythecsp
          DB_USERNAME=scythecspuser
          DB_PASSWORD=At9tYFf0wUHFa2e6GqpS

          SESSION_DRIVER=database
          SESSION_LIFETIME=500
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=null

          BROADCAST_CONNECTION=reverb
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database

          CACHE_STORE=database

          MEMCACHED_HOST=127.0.0.1

          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PASSWORD=null
          REDIS_PORT=6379

          MAIL_MAILER=
          MAIL_SCHEME=
          MAIL_HOST=
          MAIL_PORT=
          MAIL_USERNAME=
          MAIL_PASSWORD=
          MAIL_FROM_ADDRESS=
          MAIL_FROM_NAME=

          VITE_APP_NAME="Counseling Support Platform"

          REVERB_APP_ID=436757
          REVERB_APP_KEY=njq5rlbg3ewojtobegab
          REVERB_APP_SECRET=cbyvcoqakeyavqivdkwz
          REVERB_HOST="0.0.0.0"
          REVERB_PORT=8081
          REVERB_SCHEME=http
          REVERB_SERVER_PORT=8081
          REVERB_SERVER_HOST="0.0.0.0"

          VITE_REVERB_APP_KEY=njq5rlbg3ewojtobegab
          VITE_REVERB_HOST="csp.scythelabs.online"
          VITE_REVERB_PORT=8081
          VITE_REVERB_SCHEME=https

          GOOGLE_CLIENT_ID=682089834870-pqnliacpvd5vpct7addjim5bb30gqca4.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET=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
          GOOGLE_REDIRECT_URI=https://csp.scythelabs.online/auth/google/callback

          GROQ_API_KEY=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
          EOF

      - name: 📦 Install & build frontend assets
        run: |
          npm install
          npm run build

      - name: 🚀 Deploy to CloudPanel via SFTP / rsync
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Installing sshpass and rsync..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync

          echo "Starting file synchronization to CloudPanel server..."
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            --exclude=".git*" \
            --exclude=".github*" \
            --exclude="node_modules*" \
            --exclude="tests*" \
            --exclude="README.md" \
            --exclude="scratch*" \
            ./ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:htdocs/csp.scythelabs.online/

          echo "Running post-deployment Laravel commands on CloudPanel VPS..."
          sshpass -e ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} << 'EOF'
            cd htdocs/csp.scythelabs.online/
            chmod -R 775 storage bootstrap/cache
            php artisan storage:link || true
            php artisan migrate --force
            php artisan db:seed --force || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          EOF

          echo "✅ Deployment completed successfullys!"
